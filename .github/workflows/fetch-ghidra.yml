name: fetch-ghidra-ferry

on:
  push:
    paths:
      - '.github/workflows/fetch-ghidra.yml'

jobs:
  ferry:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Ghidra release
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            -o ghidra_12.1.4_PUBLIC_20260921.zip \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
          echo 'ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  ghidra_12.1.4_PUBLIC_20260921.zip' | sha256sum -c -
      - name: Upload ferry artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-12.1.4
          path: ghidra_12.1.4_PUBLIC_20260921.zip
          compression-level: 0
          retention-days: 1
