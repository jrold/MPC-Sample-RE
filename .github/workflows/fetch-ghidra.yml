name: fetch-ghidra-ferry

on:
  push:
    paths:
      - '.github/workflows/fetch-ghidra.yml'

jobs:
  ferry:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Ghidra release
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            -o ghidra_12.1.4_PUBLIC_20260921.zip \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
          echo 'ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  ghidra_12.1.4_PUBLIC_20260921.zip' | sha256sum -c -
          split -b 150M -d -a 2 ghidra_12.1.4_PUBLIC_20260921.zip ghidra.part.
          ls -lh ghidra.part.*
      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-part-00
          path: ghidra.part.00
          compression-level: 0
          retention-days: 1
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-part-01
          path: ghidra.part.01
          compression-level: 0
          retention-days: 1
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-part-02
          path: ghidra.part.02
          compression-level: 0
          retention-days: 1
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-part-03
          path: ghidra.part.03
          compression-level: 0
          retention-days: 1
