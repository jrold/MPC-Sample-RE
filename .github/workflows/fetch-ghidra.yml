name: polyend-tool-ferry

on:
  push:
    paths:
      - '.github/workflows/fetch-ghidra.yml'

jobs:
  ferry:
    runs-on: ubuntu-latest
    steps:
      - name: Download Polyend Tool macOS 1.2.1
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            -o Polyend_Tool_v1.2.1_macOS.zip \
            https://polyend-website.fra1.digitaloceanspaces.com/wp-content/uploads/2023/11/01084148/Polyend_Tool_v1.2.1_macOS.zip
          sha256sum Polyend_Tool_v1.2.1_macOS.zip
          ls -lh Polyend_Tool_v1.2.1_macOS.zip
      - name: Upload Polyend Tool
        uses: actions/upload-artifact@v4
        with:
          name: polyend-tool-macos-1.2.1
          path: Polyend_Tool_v1.2.1_macOS.zip
          compression-level: 0
          retention-days: 1
