name: polyend-tool-probe

on:
  push:
    paths:
      - '.github/workflows/fetch-ghidra.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Polyend Tool download page
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import urllib.request
          url='https://polyend.com/downloads/polyend-tool-downloads/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          data=urllib.request.urlopen(req,timeout=30).read()
          open('polyend-tool-page.html','wb').write(data)
          print(data.decode('utf-8','replace'))
          PY
          echo '--- LINKS ---'
          grep -Eoi 'href=["'"'][^"'"']+["'"']' polyend-tool-page.html | sed -E 's/^href=["'"']|["'"']$//g' | grep -Ei 'polyend|tool|download|zip|dmg|exe|pkg' || true
      - name: Upload page
        uses: actions/upload-artifact@v4
        with:
          name: polyend-tool-page
          path: polyend-tool-page.html
          retention-days: 1
